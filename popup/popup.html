<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212; color: #fff;
    }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 16px 10px;
    }
    header img { width: 20px; height: 20px; }
    header h1 { font-size: 14px; font-weight: 700; }

    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .row .label { font-size: 13px; font-weight: 600; }
    .row .sub { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 2px; }

    /* Toggle switch */
    .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer; border-radius: 999px;
      background: rgba(255,255,255,.25); transition: background .15s;
    }
    .slider::before {
      content: ""; position: absolute; width: 16px; height: 16px;
      left: 3px; top: 3px; border-radius: 50%; background: #fff;
      transition: transform .15s;
    }
    .switch input:checked + .slider { background: #ff2d6f; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .switch input:disabled + .slider { opacity: .4; cursor: default; }

    #hint {
      display: none; padding: 10px 16px; font-size: 11px;
      color: #ffb3cb; background: rgba(255,45,111,.12);
    }
    #hint.show { display: block; }

    h2 {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: rgba(255,255,255,.5);
      padding: 12px 16px 6px;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .keys { padding: 0 16px 14px; }
    .key-row {
      display: flex; align-items: center; gap: 10px;
      padding: 5px 0; font-size: 12px; color: rgba(255,255,255,.85);
    }
    kbd {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 6px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      border-bottom-width: 2px; border-radius: 5px;
      font-family: inherit; font-size: 12px; font-weight: 700;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" />
    <h1>Reel Seeker</h1>
  </header>

  <div class="row">
    <div>
      <div class="label">Auto-next reel</div>
      <div class="sub">Jump to the next reel when one ends</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="autonext" disabled />
      <span class="slider"></span>
    </label>
  </div>

  <div id="hint">Open a video on instagram.com to control this.</div>

  <h2>Keyboard shortcuts</h2>
  <div class="keys">
    <div class="key-row"><kbd>,</kbd> Back 10 seconds</div>
    <div class="key-row"><kbd>.</kbd> Forward 10 seconds</div>
    <div class="key-row"><kbd>k</kbd> Play / pause</div>
    <div class="key-row"><kbd>m</kbd> Sound on / off</div>
    <div class="key-row"><kbd>a</kbd> Toggle auto-next</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
