<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1400px; height: 560px; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(900px 600px at 90% -15%, rgba(150,47,191,.5), transparent 60%),
        radial-gradient(800px 640px at -6% 115%, rgba(255,45,111,.38), transparent 60%),
        linear-gradient(135deg, #17101f 0%, #1d1026 55%, #240f1c 100%);
      color: #fff; position: relative;
      display: flex; align-items: center; padding: 0 90px;
    }
    body::before {
      content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 26px 26px;
    }

    .left { position: relative; width: 640px; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
    .mark {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, #ff2d6f, #962fbf);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 28px rgba(255,45,111,.5);
    }
    .mark svg { width: 28px; height: 28px; fill: #fff; }
    .name { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }

    h1 {
      font-size: 52px; line-height: 1.1; font-weight: 800;
      letter-spacing: -.025em; margin-bottom: 22px;
    }
    h1 .accent {
      background: linear-gradient(90deg, #ff2d6f, #c86dd7);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { font-size: 20px; line-height: 1.5; color: rgba(255,255,255,.72); margin-bottom: 30px; max-width: 560px; }

    .chips { display: flex; flex-wrap: wrap; gap: 10px; max-width: 580px; }
    .chip {
      font-size: 15px; font-weight: 700; padding: 9px 16px; border-radius: 999px;
      background: rgba(255,45,111,.14); border: 1px solid rgba(255,45,111,.45);
      color: #ffcede;
    }

    /* ---- reel mockup ---- */
    .stage { position: relative; margin-left: auto; z-index: 1; }
    .reel {
      width: 300px; height: 430px; border-radius: 20px; position: relative;
      background:
        radial-gradient(220px 200px at 70% 22%, rgba(255,45,111,.5), transparent 65%),
        radial-gradient(260px 240px at 20% 80%, rgba(79,91,213,.55), transparent 65%),
        linear-gradient(160deg, #2b1837, #180f22 70%);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 34px 70px rgba(0,0,0,.6);
      overflow: hidden;
    }
    .reel .glow {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
      width: 74px; height: 74px; border-radius: 50%;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(2px);
    }
    .reel .glow svg { width: 32px; height: 32px; fill: #fff; }

    .dl {
      position: absolute; top: 12px; right: 12px;
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
    }
    .dl svg { width: 19px; height: 19px; fill: #fff; }

    .bar {
      position: absolute; left: 10px; right: 10px; bottom: 10px;
      height: 46px; border-radius: 12px;
      background: rgba(0,0,0,.62); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; gap: 8px; padding: 0 12px;
    }
    .bar svg { width: 15px; height: 15px; fill: #fff; flex-shrink: 0; }
    .t { font-size: 10px; font-weight: 600; color: rgba(255,255,255,.9); flex-shrink: 0; }
    .track { position: relative; flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.28); }
    .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 38%; border-radius: 4px; background: #ff2d6f; }
    .thumb {
      position: absolute; left: 38%; top: 50%; transform: translate(-50%,-50%);
      width: 10px; height: 10px; border-radius: 50%; background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.5);
    }
    .sp { font-size: 10px; font-weight: 800; flex-shrink: 0; }

    /* floating shortcut keys — above the card, hugging its left edge */
    .keys {
      position: absolute; left: -132px; bottom: 64px; z-index: 2;
      display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    }
    .key {
      display: flex; align-items: center; gap: 8px;
      background: rgba(18,18,18,.92); border: 1px solid rgba(255,255,255,.14);
      border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600;
      color: rgba(255,255,255,.85);
      box-shadow: 0 10px 24px rgba(0,0,0,.5);
    }
    kbd {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 6px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.28); border-bottom-width: 2px;
      border-radius: 5px; font-family: inherit; font-size: 12px; font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      <div class="name">ReelFlow</div>
    </div>
    <h1>The video controls<br /><span class="accent">Instagram forgot</span></h1>
    <p class="sub">A real seek bar, playback speed, auto-next and one-click downloads — on every reel, post and video.</p>
    <div class="chips">
      <span class="chip">Seek bar</span>
      <span class="chip">0.5&times;&ndash;2&times; speed</span>
      <span class="chip">Auto-next</span>
      <span class="chip">Downloads</span>
      <span class="chip">Side panel player</span>
    </div>
  </div>

  <div class="stage">
    <div class="keys">
      <span class="key"><kbd>d</kbd> Download</span>
      <span class="key"><kbd>a</kbd> Auto-next</span>
      <span class="key"><kbd>k</kbd> Play / pause</span>
    </div>
    <div class="reel">
      <div class="dl"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg></div>
      <div class="glow"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      <div class="bar">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a5 5 0 1 0 5 5h2a7 7 0 1 1-7-7z"/></svg>
        <span class="t">0:12</span>
        <span class="track"><span class="fill"></span><span class="thumb"></span></span>
        <span class="t">0:29</span>
        <span class="sp">1.25&times;</span>
      </div>
    </div>
  </div>
</body>
</html>
